# Red vial de Paraguay (OpenStreetMap) servida por OSRM en local, sin límites de uso.
#
#   docker compose run --rm preparar     # una vez: baja el mapa y lo procesa (~ minutos)
#   docker compose up -d                 # levanta OSRM en http://localhost:5000 y el visor
#                                        # (otro puerto: OSRM_PUERTO=5080 en .env)
#   python3 demo/consulta.py             # ruta y matriz de tiempos entre puntos de prueba
#   visor (mapa): http://localhost:8080  # se levanta con `docker compose up -d`
#                                        # (otro puerto: VISOR_PUERTO=8088 en .env)
#   docker compose down
#
# El mapa procesado (~600 MB) vive en el volumen de Docker `osrm-datos`, no en el repo.
# Para actualizarlo: `docker compose --profile preparar down -v` (borra el volumen; el
# `--profile` hace falta para quitar también el contenedor `mapa`) y volver a correr `preparar`.
# Datos © colaboradores de OpenStreetMap (ODbL). Extracto de Geofabrik.

x-osrm: &osrm
  image: ghcr.io/project-osrm/osrm-backend:v6.0.0
  volumes:
    - osrm-datos:/datos

services:
  # Descarga el extracto de Paraguay si no está. Baja a un temporal y lo renombra al
  # terminar, para que una descarga cortada no quede como mapa válido.
  mapa:
    image: alpine:3.20
    profiles: [preparar]
    volumes:
      - osrm-datos:/datos
    command: >
      sh -c 'test -s /datos/paraguay-latest.osm.pbf
      || (wget -O /datos/descarga.tmp
      https://download.geofabrik.de/south-america/paraguay-latest.osm.pbf
      && mv /datos/descarga.tmp /datos/paraguay-latest.osm.pbf)'

  # Procesa el mapa para el algoritmo MLD (perfil de auto).
  preparar:
    <<: *osrm
    profiles: [preparar]
    depends_on:
      mapa:
        condition: service_completed_successfully
    command: >
      sh -c 'osrm-extract -p /opt/car.lua /datos/paraguay-latest.osm.pbf
      && osrm-partition /datos/paraguay-latest.osrm
      && osrm-customize /datos/paraguay-latest.osrm'

  # Servidor de ruteo: /route (entre puntos) y /table (matriz de tiempos y distancias).
  osrm:
    <<: *osrm
    ports:
      # Puerto en la máquina: OSRM_PUERTO en .env (no se versiona) si el 5000 está ocupado.
      - "${OSRM_PUERTO:-5000}:5000"
    # --max-table-size: el valor por defecto (100) limita la matriz a 100 x 100 puntos.
    command: osrm-routed --algorithm mld --max-table-size 1000 /datos/paraguay-latest.osrm
    restart: unless-stopped

  # Visor: mapa con Leaflet + OpenStreetMap (demo/index.html). Pasa /osrm/ al servidor OSRM.
  visor:
    image: nginx:1.27-alpine
    depends_on:
      - osrm
    ports:
      - "${VISOR_PUERTO:-8080}:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro
      - ./demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  # Mapa de OSM y archivos procesados por OSRM. Un volumen y no una carpeta del repo: no deja
  # archivos de root en la máquina y en Docker Desktop (Windows / Mac) es mucho más rápido.
  osrm-datos:
