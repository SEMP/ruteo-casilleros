# Sirve el visor (demo/) y pasa /osrm/ al servidor OSRM de la red de compose, para que la
# página no dependa del puerto de OSRM en la máquina ni de CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /osrm/ {
        proxy_pass http://osrm:5000/;
    }

    # Que los cambios en demo/ se vean al recargar, sin caché.
    add_header Cache-Control "no-store";
}
